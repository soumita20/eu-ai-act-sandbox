[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "eu-ai-act-sandbox"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2,<3",
    "pypdf>=6,<7",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6,<7",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "prometheus-client>=0.21,<1",
]
test = [
    "httpx>=0.27,<1",
]

tracing = [
    "opentelemetry-api>=1.45,<2",
    "opentelemetry-sdk>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b1,<0.67",
]
ui = ["streamlit>=1.66.1,<2", "httpx>=0.27,<1"]
quality = ["ruff>=0.14,<1"]
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
]
[tool.setuptools.packages.find]
where = ["src"]
include = ["eu_ai_act_sandbox*"]
namespaces = false







[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
