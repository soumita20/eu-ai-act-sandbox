# Run Prometheus from the repository root so the relative credentials path resolves.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - deployment/observability/alerts/eu-ai-act-sandbox-api.rules.yml

scrape_configs:
  - job_name: eu-ai-act-sandbox-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - 127.0.0.1:8000
    authorization:
      type: Bearer
      credentials_file: deployment/observability/secrets/api_key

