apiVersion: 1

providers:
  - name: eu-ai-act-sandbox
    orgId: 1
    folder: EU AI Act Sandbox
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      # Change this to the absolute path where the dashboard JSON is mounted or installed.
      path: /var/lib/grafana/dashboards/eu-ai-act-sandbox
      foldersFromFilesStructure: false
